# LLM-WIKI governance gates for a pull request.
#
# ## Runner minutes
#
# On a PUBLIC repository GitHub-hosted runners are free and nothing below costs
# anything. On a PRIVATE repository every minute here is billed against the
# account's Actions allowance, and that allowance is shared by the whole
# organization — one busy repository can exhaust it for every other one.
#
# The gates themselves are cheap: `validate-frontmatter`, `validate` and
# `impact` read Markdown and finish in seconds. What costs minutes is the
# machinery around them — the full-history checkout and Node setup. This file
# is already trimmed to the cheapest shape that still gates: no dependency
# install, no test suite, a 10-minute cap, and superseded runs cancelled.
#
# Two ways to pay nothing, in the order worth considering:
#
# 1. **Run the gates locally instead.** `templates/git-hooks/pre-commit` runs
#    the same checks against the working tree before a commit exists. No
#    runner, no minutes, no workflow at all. The cost is that a hook can be
#    bypassed (`--no-verify`), so it governs a cooperating team rather than an
#    enforced branch.
#
# 2. **Point this workflow at a self-hosted runner.** Minutes on a self-hosted
#    runner are not billed, and the strength of a required status check is
#    preserved. Set a repository or organization variable `LLM_WIKI_RUNNER` to
#    the runner's label (e.g. `wiki-linux`); `runs-on` below follows it, so no
#    edit to this file is needed. Leave it unset and this stays on
#    `ubuntu-latest`.
#
#    Do not set that variable before a runner carrying the label is online: a
#    job with no matching runner does not fail, it sits queued (GitHub drops it
#    after 24h), and a required check that never reports blocks the PR in a way
#    that reads like nothing is happening. Self-hosted runners are also unsafe
#    on a public repository, where a fork's PR can run arbitrary code on the
#    machine.
name: LLM-WIKI Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Push twice to a branch and the first run becomes worthless the moment the
# second starts — but it keeps running, and on a private repository it keeps
# billing. Only the newest commit's verdict matters for a gate, so cancel the
# older run. Keyed by ref so branches never cancel each other.
concurrency:
  group: llm-wiki-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llm-wiki:
    name: Validate LLM-WIKI
    # Set the LLM_WIKI_RUNNER variable to a self-hosted runner's label to stop
    # spending billed minutes; unset, this is the GitHub-hosted default. See the
    # runner-minutes note at the top of this file before setting it.
    runs-on: ${{ vars.LLM_WIKI_RUNNER || 'ubuntu-latest' }}
    # These gates read Markdown and finish in seconds. Without a cap a hung step
    # runs to GitHub's 6-hour default, which on a private repository is a day's
    # allowance spent on a job nobody is waiting for.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Required by the omission gate below: `impact --since <ref>` compares
          # against the PR base, and the default shallow checkout does not have
          # that ref. Without this the gate degrades silently rather than failing
          # loudly, which is the worst way for a gate to break.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # There is no `npm ci` step. The gates need exactly one package — this one,
      # which has no runtime dependencies — so installing the repository's whole
      # dependency tree buys them nothing and is usually the longest step in the
      # file. Each gate below fetches the pinned CLI directly instead. This also
      # means llm-wiki-governance does NOT have to be a devDependency for this
      # workflow to work.
      #
      # The package is named in full, with a version pin. Never shorten it to
      # `npx llm-wiki`: this package's bin is named `llm-wiki`, but npm also
      # hosts an UNRELATED package under that name, so the short form downloads
      # and runs a stranger's code. Bump the pin when you upgrade — or set it to
      # `latest` if you would rather float.
      #
      # If you prefer the dependency to be locked in your own package.json, the
      # old shape still works: add a `- run: npm ci` step and change these to
      # `npx --no-install llm-wiki <command>`. That trades runner minutes for a
      # lockfile-pinned version.
      #
      # Your test suite is deliberately NOT run here either. None of the gates
      # depend on it, and on a private repository a full suite is usually the
      # single most expensive thing in a workflow — paid for twice when the
      # repository's own CI already runs it. Add it back only if this workflow
      # is the only CI the repository has.

      - name: Validate LLM-WIKI frontmatter
        run: npx -y llm-wiki-governance@1.32 validate-frontmatter

      - name: Validate LLM-WIKI strictly
        run: npx -y llm-wiki-governance@1.32 validate --strict --agent codex

      # The omission gate: fails when a source file a `verified` document is
      # grounded in changed in this diff and the document did not. validate and
      # validate-frontmatter above cannot see this — they check the documents
      # that exist, not the documents that should have been touched. Until
      # 2026-07-31 no shipped channel ran this, so nothing this project handed an
      # adopter could block an undocumented change.
      #
      # Since 1.28.0 impact.source_changed defaults to error, so this step blocks
      # with or without --strict; --strict is kept so the step's other findings
      # escalate too. Soften it in llm-wiki.config.json rules
      # ("impact.source_changed": "warning"|"info"|"off") or rulesPreset:
      # "relaxed" — not by deleting the step. A package.json whose diff moves
      # nothing but the version value does not count as a source change.
      #
      # Governance mode gates this step too (1.30.0): under `lite`
      # impact.source_changed is `off` and under `standard` it is a warning, so on
      # a project in either mode this step PASSES while catching nothing. That is
      # the intended meaning of those modes — but if you wired this workflow to get
      # an omission gate, check `llm-wiki mode` and make sure the project is in
      # `strict`, or set the rule explicitly in llm-wiki.config.json.
      - name: Gate on undocumented source changes
        run: npx -y llm-wiki-governance@1.32 impact --since "origin/${{ github.base_ref || 'main' }}" --strict
