name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Nothing below pushes, so the job token is not left in .git/config for
          # the test and pack steps to read.
          persist-credentials: false

      # `registry-url` makes setup-node write an .npmrc whose auth line reads
      # `_authToken=${NODE_AUTH_TOKEN}`; with no secret wired in, that variable is
      # setup-node's placeholder and authenticates nothing. npm authenticates with
      # the token it exchanges for this job's OIDC identity (Trusted Publishing).
      # This is the shape that published 1.16.1-1.29.2 with no token at all.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Fail early and say why, instead of an auth error at the end of the job:
      # Trusted Publishing needs npm 11.5.1 or later and an OIDC token request,
      # which GitHub offers only when the job may mint an ID token.
      - name: Verify Trusted Publishing prerequisites
        run: |
          node -e "const v=process.argv[1]; const [a,b,c]=v.split('.').map(Number); if (!(a>11 || (a===11 && (b>5 || (b===5 && c>=1))))) { console.error('npm ' + v + ' predates Trusted Publishing (needs 11.5.1 or later).'); process.exit(1); }" "$(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "No OIDC token request is available to this job; it needs the id-token permission." >&2
            exit 1
          fi

      - name: Verify package identity
        run: |
          node -e "const p=require('./package.json'); if (p.name !== 'llm-wiki-governance') { console.error('Unexpected package name:', p.name); process.exit(1); }"

      - name: Verify tag matches package version
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME || ''; const version=tag.replace(/^v/, ''); if (tag === version || version !== p.version) { console.error('Tag ' + tag + ' does not match package version ' + p.version); process.exit(1); }"

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Validate frontmatter
        run: node bin/llm-wiki.js validate-frontmatter

      - name: Run doctor
        run: node bin/llm-wiki.js doctor --format markdown

      - name: Check package contents
        run: npm pack --dry-run

      # Trusted Publishing only: no long-lived npm token is passed to this step, so a
      # broken Trusted Publisher registration fails the release instead of quietly
      # falling back to a stored token. The registry records the identity that
      # published each version (`_npmUser.trustedPublisher`); every version from
      # 1.16.1 to 1.35.0 shows OIDC. v1.29.3/v1.29.4 failed because the 2026-09-03
      # repository swap invalidated the registration, which binds to the repository
      # object, not its name (GATE_REVIEW.md "Publish Credential Cleanup").
      - name: Publish to npm
        run: npm publish --access public --provenance

  # GitHub Release on the same v* tag push (GATE_REVIEW.md Gate 12). Runs only
  # after npm publish succeeds. Isolated to contents:write (job-level permissions
  # REPLACE the workflow-level id-token:write, so this job cannot mint an OIDC
  # token and the publish job cannot create releases). The body is generated by
  # the read-only `release-notes --body-only`, which scans the notes for
  # sensitive-looking values and exits non-zero (withholding the body) on a match.
  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # `gh` below authenticates through GH_TOKEN; git itself only reads tags.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Generate release body from release notes
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            node bin/llm-wiki.js release-notes --body-only --since "$prev_tag" > release-body.md
          else
            node bin/llm-wiki.js release-notes --body-only > release-body.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-body.md --verify-tag
